name = "InfoTheory"
keywords = ["math", "information-theory", "ergodic-theory"]
defaultTargets = ["InfoTheory"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "68b30e537da83f057bd4f15dae11632af0a198eb"

[[lean_lib]]
name = "InfoTheory"
